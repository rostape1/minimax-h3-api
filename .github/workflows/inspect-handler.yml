name: inspect-handler

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Pull base image
        run: docker pull brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130

      - name: Inspect entrypoint/cmd/workdir
        run: docker inspect brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 --format '{{json .Config}}' | python3 -m json.tool

      - name: Find handler-ish files
        run: |
          docker run --rm --entrypoint find brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 / -maxdepth 3 -iname "*handler*" -o -iname "*rp_*" -o -iname "start.sh" 2>/dev/null || true

      - name: Find runpod package location
        run: |
          docker run --rm --entrypoint sh brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 -c "pip show runpod 2>/dev/null; python3 -c 'import runpod, os; print(os.path.dirname(runpod.__file__))' 2>/dev/null" || true

      - name: List root and common dirs
        run: |
          docker run --rm --entrypoint ls brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 -la /
