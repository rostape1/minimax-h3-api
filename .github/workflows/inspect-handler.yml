name: inspect-handler

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Pull base image
        run: docker pull brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130

      - name: Dump /handler.py
        run: docker run --rm --entrypoint cat brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 /handler.py

      - name: Find rp_upload usage
        run: docker run --rm --entrypoint grep brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 -n "rp_upload\|images\|gifs" /handler.py
