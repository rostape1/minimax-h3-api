name: inspect-handler

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Pull base image
        run: docker pull brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130

      - name: Cat start.sh
        run: docker run --rm --entrypoint cat brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 /start.sh

      - name: Cat post_start.sh
        run: docker run --rm --entrypoint cat brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 /post_start.sh

      - name: Check python/pip and key packages
        run: |
          docker run --rm --entrypoint sh brunorovoletto/minimax-h3-ltx-2.3-comfyui:cuda130 -c "
            which python3; python3 --version;
            /app/ComfyUI_env/bin/pip list 2>/dev/null | grep -iE 'runpod|aiohttp|comfy|boto3' || echo 'no matches in ComfyUI_env';
            ls -la /app/ComfyUI | head -20;
            ls /app/ComfyUI/main.py 2>&1;
          "
